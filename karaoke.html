<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>卡拉OK · 歌詞播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; }
  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #fff; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden; -webkit-text-size-adjust: 100%;
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 20px 6px; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pickBtn, #fsBtn { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff;
             border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }

  /* ---------- lyrics ---------- */
  #lyricsWrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 24px; scroll-behavior: smooth;
    mask-image: linear-gradient(transparent 0, #000 10%, #000 84%, transparent 100%);
    -webkit-mask-image: linear-gradient(transparent 0, #000 10%, #000 84%, transparent 100%); }
  .line { padding: 14px 0; font-size: clamp(19px, 6.2vw, 34px); font-weight: 600;
    line-height: 1.5; color: rgba(255,255,255,.28); text-align: center;
    transition: color .35s, transform .35s, opacity .35s, font-size .35s; transform-origin: center; cursor: pointer; }
  .line.gap { color: rgba(255,255,255,.15); letter-spacing: 6px; }
  .line.active { color: #fff; font-size: clamp(28px, 9vw, 52px); font-weight: 700; }

  /* ---------- controls ---------- */
  #controls { flex-shrink: 0; padding: 10px 20px 18px;
              background: linear-gradient(transparent, rgba(0,0,0,.9) 30%); }
  #bar { width: 100%; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 2px;
         background: rgba(255,255,255,.2); outline: none; cursor: pointer; }
  #bar::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
         border-radius: 50%; background: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; gap: 10px; }
  #time { font-size: 11px; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; min-width: 86px; }
  #play { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7);
    background: transparent; color: #fff; font-size: 26px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: transform .15s, background .2s; flex-shrink: 0; }
  #play:active { transform: scale(.92); background: rgba(255,255,255,.12); }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; font-size: 13px; min-width: 52px;
    border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.55);
    background: transparent; cursor: pointer; transition: all .25s; }
  .chip.on { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
  .spdWrap { display: flex; align-items: center; gap: 6px; }
  .spdWrap input { width: 92px; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.25); outline: none; }
  .spdWrap input::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; }
  #spdLbl { font-size: 12px; color: rgba(255,255,255,.7); min-width: 40px; text-align: center;
    font-variant-numeric: tabular-nums; }
  #spdLbl.hot { color: #fff; font-weight: 700; }
  #err { display: none; text-align: center; color: #ff6b6b; font-size: 13px; padding: 8px 0; }

  /* ---------- song picker sheet ---------- */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.65); opacity: 0;
    pointer-events: none; transition: opacity .25s; z-index: 10; }
  #sheet.show { opacity: 1; pointer-events: auto; }
  #sheetBox { position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%;
    background: #111; border-radius: 18px 18px 0 0; transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,.33,1); display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom); }
  #sheet.show #sheetBox { transform: translateY(0); }
  #sheetBox .head { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px 10px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.85); }
  #sheetBox .head button { background: none; border: none; color: rgba(255,255,255,.5);
    font-size: 18px; padding: 4px 8px; cursor: pointer; }
  #songList { list-style: none; overflow-y: auto; padding-bottom: 14px; }
  #songList li { padding: 15px 20px; font-size: 16px; color: rgba(255,255,255,.75); cursor: pointer; }
  #songList li:active { background: rgba(255,255,255,.08); }
  #songList li.cur { color: #fff; font-weight: 600; }

  /* ---------- landscape: much bigger lyrics, chrome becomes overlay ---------- */
  @media (orientation: landscape) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
             background: linear-gradient(#000, transparent); padding: 8px 20px 20px; }
    #controls { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; }
    #lyricsWrap { padding: 64px 4vw 138px; }
    .line { font-size: clamp(20px, 6vh, 38px); padding: 8px 0; }
    .line.active { font-size: clamp(34px, 12vh, 76px); }
    #play { width: 54px; height: 54px; font-size: 19px; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="title">載入中…</h1>
    <div style="display:flex;gap:8px">
      <button id="fsBtn" hidden>⛶</button>
      <button id="pickBtn">☰ 選歌</button>
    </div>
  </header>

  <div id="lyricsWrap"><div id="lyrics"></div></div>

  <div id="controls">
    <div id="err">⚠️ 無法載入音檔 — 請確認此頁面與 MP3 在同一資料夾／同一網址</div>
    <div class="chips" style="margin-bottom:8px;flex-wrap:wrap;justify-content:center">
      <button class="chip" id="keyDown">♭ −1</button>
      <button class="chip" id="keyLbl">原調</button>
      <button class="chip" id="keyUp">♯ +1</button>
      <span class="spdWrap">
        <input type="range" id="spdBar" min="0" max="7" step="1" value="5">
        <span id="spdLbl">1×</span>
      </span>
      <button class="chip" id="loopBtn">🔁 循環</button>
    </div>
    <input type="range" id="bar" min="0" max="1000" value="0">
    <div class="row">
      <span id="time">0:00 / 0:00</span>
      <button id="play" aria-label="play/pause">▶</button>
      <span style="min-width:86px"></span>
    </div>
  </div>

  <div id="sheet">
    <div id="sheetBox">
      <div class="head"><span>選歌</span><button id="closeSheet">✕</button></div>
      <ul id="songList"></ul>
      <div style="display:flex;gap:8px;align-items:center;padding:12px 20px 16px;border-top:1px solid rgba(255,255,255,.12)">
        <span style="font-size:13px;color:rgba(255,255,255,.6)">歌詞同步</span>
        <button class="chip" id="lyrMinus">−</button>
        <span id="lyrOffLbl" style="font-size:13px;min-width:56px;text-align:center">0.00s</span>
        <button class="chip" id="lyrPlus">+</button>
        <button class="chip" id="lyrReset">重設</button>
      </div>
    </div>
  </div>

</script>
<script>
/* ============ app: native <audio> engine (iOS background-safe) ============
   - playback: plain <audio> element → keeps playing in background / lock screen
   - speed: audio.playbackRate (pitch-preserved natively)
   - key: SoundTouch pre-rendered offline to a WAV blob, then played as normal audio */
const PLAYLIST = [
  { name: "歌曲 1",  file: "song1.mp3"  },
  { name: "歌曲 2",  file: "song2.mp3"  },
  { name: "歌曲 3",  file: "song3.mp3"  },
  { name: "歌曲 4",  file: "song4.mp3"  },
  { name: "歌曲 4F", file: "song4f.mp3" },
];

const wrap     = document.getElementById("lyricsWrap");
const box      = document.getElementById("lyrics");
const playBtn  = document.getElementById("play");
const bar      = document.getElementById("bar");
const timeEl   = document.getElementById("time");
const titleEl  = document.getElementById("title");
const errEl    = document.getElementById("err");
const sheet    = document.getElementById("sheet");
const listEl   = document.getElementById("songList");
const spdBar   = document.getElementById("spdBar");
const spdLbl   = document.getElementById("spdLbl");
const loopBtn  = document.getElementById("loopBtn");
const keyDown  = document.getElementById("keyDown");
const keyUp    = document.getElementById("keyUp");
const keyLbl   = document.getElementById("keyLbl");
const lyrMinus = document.getElementById("lyrMinus");
const lyrPlus  = document.getElementById("lyrPlus");
const lyrReset = document.getElementById("lyrReset");
const lyrLbl   = document.getElementById("lyrOffLbl");

let songs = PLAYLIST.map(s => ({ ...s })), curSong = 0, lines = [], cur = -1, seeking = false, key = 0;
let userScrollUntil = 0;
const SPD = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2];
let spdIdx = 5, loopOn = false, playing = false, lyrOff = 0, pendingSeek = 0;
let renderToken = 0;
const blobCache = {};                       // "file|key" → objectURL

/* ---------- audio element ---------- */
const audio = new Audio();
audio.preload = "auto";
audio.preservesPitch = true;
if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = true;

let ctx = null;
const getCtx = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
async function decode(url) {
  const ab = await (await fetch(url)).arrayBuffer();
  return await new Promise((res, rej) => getCtx().decodeAudioData(ab, res, rej));
}

/* ---------- offline SoundTouch render → WAV blob ---------- */
function toWav(L, R, sr) {
  const n = L.length, buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + n * 4, true); ws(8, "WAVE"); ws(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true);
  v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, n * 4, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    v.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true); o += 2;
    v.setInt16(o, Math.max(-1, Math.min(1, R[i])) * 32767, true); o += 2;
  }
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
async function renderKeyed(file, k, onProg) {
  const st = new SoundTouch(); st.pitchSemitones = k;
  const buffer = await decode(file);
  const filter = new SimpleFilter(new WebAudioBufferSource(buffer), st);
  const CH = 16384, chunk = new Float32Array(2 * CH);
  const out = new Float32Array(2 * (buffer.length + CH)), sr = buffer.sampleRate;
  let w = 0, n, done = 0;
  while ((n = filter.extract(chunk, CH)) > 0) {
    out.set(chunk.subarray(0, 2 * n), w); w += 2 * n; done += n;
    if (onProg && (done & 65535) < CH) { onProg(done / buffer.length);
      await new Promise(r => setTimeout(r)); }              // yield → progress paints
  }
  const frames = w / 2, L = new Float32Array(frames), R = new Float32Array(frames);
  for (let i = 0; i < frames; i++) { L[i] = out[2*i]; R[i] = out[2*i+1]; }
  return toWav(L, R, sr);
}

/* ---------- transport ---------- */
function fmt(s) { return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`; }
const getPos = () => audio.currentTime || 0;
const getDur = () => audio.duration || 0;

function setSrcAndGo(url, keepTime) {
  const was = playing, t = keepTime ? getPos() : pendingSeek;
  audio.src = url;
  audio.loop = loopOn;
  audio.playbackRate = SPD[spdIdx];
  pendingSeek = t;
  if (was) audio.play().catch(()=>{});
}
function applyAudioState() {
  audio.loop = loopOn;
  audio.playbackRate = SPD[spdIdx];
}

/* ---------- load song ---------- */
async function loadSong(idx, autoplay) {
  curSong = idx;
  const s = songs[idx];
  titleEl.textContent = s.name + " · 載入中…";
  if (!s.lrcText) {
    try { s.lrcText = await (await fetch(s.file.replace(/\.mp3$/i, ".lrc"))).text(); } catch(e) {}
  }
  lines = parseLRC(s.lrcText || "");
  buildLyrics();
  lyrOff = parseFloat(localStorage.getItem("lyroff:" + s.file)) || 0;
  setOffLbl();
  pendingSeek = 0;
  setSrcAndGo(key !== 0 ? (blobCache[ck(s.file)] || s.file) : s.file, false);
  if (key !== 0 && !blobCache[ck(s.file)]) applyKey(key, true);
  titleEl.textContent = s.name;
  renderList();
  updateMediaSession();
  if (autoplay) audio.play().catch(()=>{});
  else render(true);
}
const ck = f => f + "|" + key;

/* ---------- key control (offline pre-render, cached) ---------- */
function setKeyUI() {
  keyLbl.textContent = key === 0 ? "原調" : (key > 0 ? "+" + key : "−" + Math.abs(key));
  keyLbl.classList.toggle("on", key !== 0);
}
async function applyKey(k, silent) {
  k = Math.max(-8, Math.min(8, k));
  const token = ++renderToken;
  key = k; setKeyUI();
  if (k === 0) { setSrcAndGo(songs[curSong].file, true); return; }
  const id = songs[curSong].file + "|" + k;
  if (!blobCache[id]) {
    keyLbl.textContent = "…";
    try {
      blobCache[id] = await renderKeyed(songs[curSong].file, k, p => {
        keyLbl.textContent = Math.round(p * 100) + "%";
      });
    } catch(e) {
      errEl.style.display = "block";
      key = 0; setKeyUI(); return;
    }
  }
  if (token !== renderToken) return;                       // a newer tap superseded us
  setKeyUI();
  if (!silent) setSrcAndGo(blobCache[id], true);
}
keyDown.onclick = () => applyKey(key - 1);
keyUp.onclick   = () => applyKey(key + 1);
keyLbl.onclick  = () => applyKey(0);

/* ---------- lyrics ---------- */
function parseLRC(text) {
  return text.trim().split("\n").map(l => {
    const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    return m ? { t: +m[1]*60 + +m[2], text: m[3].trim() } : null;
  }).filter(Boolean);
}
function buildLyrics() {
  box.innerHTML = lines.length
    ? lines.map((l,i)=>`<div class="line${l.text?"":" gap"}" data-i="${i}">${l.text||"♪ ♪ ♪"}</div>`).join("")
    : `<div class="line active">（此歌暫無歌詞）</div>`;
  cur = -1;
  render(true);
}
function center(i, instant) {
  const el = box.children[i]; if (!el) return;
  wrap.scrollTo({ top: el.offsetTop - wrap.clientHeight/2 + el.clientHeight/2,
                  behavior: instant ? "auto" : "smooth" });
}
function render(force) {
  if (lines.length) {
    const t = getPos() + 0.15 + lyrOff;
    let i = 0; while (i+1 < lines.length && lines[i+1].t <= t) i++;
    if (i !== cur || force) {
      cur = i;
      [...box.children].forEach((el,k)=>el.classList.toggle("active", k===i));
      if (Date.now() > userScrollUntil) center(i, force);
    }
  }
  const d = getDur();
  if (!seeking) bar.value = d ? (getPos()/d)*1000 : 0;
  timeEl.textContent = `${fmt(getPos())} / ${fmt(d)}`;
}
function tick() { render(); if (playing && !document.hidden) requestAnimationFrame(tick); }

/* ---------- playlist discovery ---------- */
async function discover() {
  try {
    const html = await (await fetch("./")).text();
    const hrefs = [...new DOMParser().parseFromString(html,"text/html").querySelectorAll("a")]
      .map(a => a.getAttribute("href")).filter(Boolean);
    const mp3s = hrefs.filter(h => /\.mp3$/i.test(h));
    if (!mp3s.length) return;
    const clean = h => decodeURIComponent(h).replace(/\.mp3$/i,"")
      .replace(/\s*\[[^\]]*\]\s*$/,"").replace(/\s*[｜|][^｜|]*$/,"").trim();
    const have = new Set(PLAYLIST.map(s => s.file));
    const byName = new Map(PLAYLIST.map(s => [s.name, { ...s }]));
    for (const mp3 of mp3s) {
      if (have.has(mp3) || have.has(decodeURIComponent(mp3))) continue;
      const name = clean(mp3), isKtv = /伴奏|karaoke/i.test(mp3);
      const ex = byName.get(name);
      if (ex && (ex.isKtv === undefined || ex.isKtv === isKtv || isKtv)) continue;
      byName.set(name, { name, file: mp3, isKtv });
    }
    songs = [...byName.values()];
  } catch(e) { /* static hosting → keep hardcoded playlist */ }
}
function renderList() {
  listEl.innerHTML = songs.map((s,i)=>
    `<li class="${i===curSong?"cur":""}" data-i="${i}">${i===curSong?"▶ ":""}${s.name}</li>`).join("");
}

/* ---------- controls ---------- */
playBtn.onclick = () => audio.paused ? audio.play().catch(()=>{}) : audio.pause();
audio.onplay  = () => { playing = true;  playBtn.textContent = "❚❚"; tick(); updateMediaSession(); };
audio.onpause = () => { playing = false; playBtn.textContent = "▶"; render(true); };
audio.ontimeupdate = () => render();                      // fires in background too
audio.onloadedmetadata = () => { if (pendingSeek > 0 && pendingSeek < audio.duration) audio.currentTime = pendingSeek; render(true); };
audio.onerror = () => errEl.style.display = "block";

bar.oninput  = () => seeking = true;
bar.onchange = () => { audio.currentTime = (bar.value/1000)*getDur(); seeking = false; };

box.onclick = e => {
  const el = e.target.closest(".line");
  if (el && lines[+el.dataset.i]) { audio.currentTime = lines[+el.dataset.i].t - lyrOff; audio.play().catch(()=>{}); }
};

/* speed ratio bar: 0.5 – 1.2 in 0.1 steps, live & pitch-preserved */
spdBar.oninput = () => {
  spdIdx = +spdBar.value;
  audio.playbackRate = SPD[spdIdx];
  spdLbl.textContent = SPD[spdIdx] + "×";
  spdLbl.classList.toggle("hot", SPD[spdIdx] !== 1);
};
loopBtn.onclick = () => { loopOn = !loopOn; applyAudioState(); loopBtn.classList.toggle("on", loopOn); };

/* lyric sync fine-tune — per song, persisted */
function setOffLbl() { lyrLbl.textContent = (lyrOff >= 0 ? "+" : "") + lyrOff.toFixed(2) + "s"; }
function adjOff(d) {
  lyrOff = Math.round((lyrOff + d) * 100) / 100;
  try { localStorage.setItem("lyroff:" + songs[curSong].file, lyrOff); } catch(e) {}
  setOffLbl(); render(true);
}
lyrMinus.onclick = () => adjOff(-0.25);
lyrPlus.onclick  = () => adjOff(0.25);
lyrReset.onclick = () => adjOff(-lyrOff);

/* lock-screen / control-center integration */
function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: songs[curSong].name, artist: "卡拉OK", album: "Karaoke" });
    navigator.mediaSession.setActionHandler("play",  () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("seekbackward", () => audio.currentTime -= 10);
    navigator.mediaSession.setActionHandler("seekforward", () => audio.currentTime += 10);
  } catch(e) {}
}

/* fullscreen */
const fsBtn = document.getElementById("fsBtn");
if (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) {
  fsBtn.hidden = false;
  fsBtn.onclick = () => {
    const d = document.documentElement, doc = document;
    if (doc.fullscreenElement || doc.webkitFullscreenElement)
      (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
    else
      (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
  };
}

/* song picker */
document.getElementById("pickBtn").onclick = () => { renderList(); sheet.classList.add("show"); };
document.getElementById("closeSheet").onclick = () => sheet.classList.remove("show");
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove("show"); };
listEl.onclick = e => {
  const li = e.target.closest("li"); if (!li) return;
  sheet.classList.remove("show");
  if (+li.dataset.i !== curSong) loadSong(+li.dataset.i, true);
};

/* don't fight user scrolling */
["touchstart","pointerdown","wheel"].forEach(ev =>
  wrap.addEventListener(ev, () => userScrollUntil = Date.now()+2500, {passive:true}));
["resize","orientationchange","load"].forEach(ev =>
  window.addEventListener(ev, () => setTimeout(() => render(true), 300)));
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(true); });

/* ---------- start ---------- */
(async () => { await discover(); loadSong(0, false); })();
</script>
</body>
</html>
