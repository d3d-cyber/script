<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>老派約會之必要 · MC 張天賦</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; }
  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: #fff;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    user-select: none; -webkit-user-select: none;
  }
  header {
    text-align: center; padding: 14px 16px 6px;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  header p  { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 3px; letter-spacing: 2px; }

  /* ---------- lyrics ---------- */
  #lyricsWrap {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding: 0 24px;
    mask-image: linear-gradient(transparent 0, #000 12%, #000 82%, transparent 100%);
    -webkit-mask-image: linear-gradient(transparent 0, #000 12%, #000 82%, transparent 100%);
  }
  .line {
    padding: 14px 0;
    font-size: clamp(19px, 6.2vw, 34px);
    font-weight: 600;
    line-height: 1.5;
    color: rgba(255,255,255,.28);          /* dim */
    text-align: center;
    transition: color .35s, transform .35s, opacity .35s;
    transform-origin: center;
    cursor: pointer;
  }
  .line.gap { color: rgba(255,255,255,.15); letter-spacing: 6px; }
  .line.active {
    color: #fff;                             /* white words */
    font-size: clamp(28px, 9vw, 52px);
    font-weight: 700;
  }

  /* ---------- controls ---------- */
  #controls {
    flex-shrink: 0;
    padding: 10px 20px 18px;
    background: linear-gradient(transparent, rgba(0,0,0,.85) 30%);
  }
  #bar { width: 100%; appearance: none; -webkit-appearance: none; height: 4px; border-radius: 2px;
         background: rgba(255,255,255,.2); outline: none; cursor: pointer; }
  #bar::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
         border-radius: 50%; background: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  #time { font-size: 11px; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
  #play {
    width: 72px; height: 72px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.7);
    background: transparent; color: #fff;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s, background .2s;
  }
  #play:active { transform: scale(.92); background: rgba(255,255,255,.12); }
  .modes { display: flex; gap: 8px; }
  .mode {
    padding: 7px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.55);
    background: transparent; cursor: pointer; transition: all .25s;
  }
  .mode.on { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
  #err { display:none; text-align:center; color:#ff6b6b; font-size:13px; padding:8px 0; }
</style>
</head>
<body>
  <header>
    <h1>老派約會之必要</h1>
    <p>MC 張天賦 · This is MC</p>
  </header>

  <div id="lyricsWrap"><div id="lyrics"></div></div>

  <div id="controls">
    <div id="err">⚠️ 找不到音檔 — 請確認 karaoke.html 與 MP3 在同一資料夾</div>
    <input type="range" id="bar" min="0" max="1000" value="0">
    <div class="row">
      <span id="time">0:00 / 3:43</span>
      <button id="play" aria-label="play/pause">▶</button>
      <div class="modes">
        <button class="mode on" data-src="0">歌詞版</button>
        <button class="mode" data-src="1">伴奏 KTV</button>
      </div>
    </div>
  </div>

<script>
/* ===== synced lyrics (LRC) — embedded so no file loading is needed ===== */
const LRC = `[00:15.47] 該怎麼初次約會 實在極費思量
[00:19.82] 起初先推我兩次 挫我氣燄都正常
[00:25.03] 再約便説好 以里數換你獎賞
[00:30.49]
[00:33.32] 找一間小店吃飯 浪漫大戲開場
[00:37.61] 於燭光跟笑意裏 談談童年 提及理想
[00:42.89] 吃到侍應生 靜靜話現已打烊
[00:49.51] 飯後未倦嗎 跟我逛逛 再送你歸家
[00:54.13] 我可以為你 關起手機 純靈魂對話
[00:58.57] 怎知道霎眼 就談到 赤柱了
[01:02.55] 錯過了 你我的家
[01:07.72] 寧像個書生 初約佳人 (與你有種牽引)
[01:12.22] 蝴蝶滿心飛 不過 未走近 (勝過世間一見就吻)
[01:17.48] 多想 一見即吻 但覺相襯
[01:21.99] 何妨從夏到秋 慢慢抱緊
[01:25.80] 明月正偷窺 這對璧人 (兩個坐這麼近)
[01:30.53] 何用太心急 一晚露底藴 (故作老派手卻在震)
[01:35.36] 承襲 古典小説裏 優雅的情感
[01:40.06] 情願 待新婚才獻吻
[01:47.69] 不急於一晚散盡 十萬夜那温柔
[01:51.72] 一針針 跟你刺繡
[01:54.08] 年華悠悠 怎會悶透
[01:56.98] 訪西廂 登紅樓 仍攜着你手
[02:03.26] 初邂逅 我喜歡雙雙 漫步在霧裏
[02:07.73] 趕攤牌 實在是沒趣
[02:09.53] 跟你這一種老派鴛侶
[02:12.65] 只想約會到八千歲 微醉寫詩作對 下去
[02:22.07] 寧像個書生 初約佳人 (與你有種牽引)
[02:26.55] 蝴蝶滿心飛 不過 未走近 (勝過世間一見就吻)
[02:31.49] 多想 一見即吻 但覺相襯
[02:35.98] 何妨從夏到秋 慢慢抱緊
[02:39.83] 明月正偷窺 這對璧人 (兩個坐這麼近)
[02:44.46] 何用太心急 一晚露底藴 (故作老派手卻在震)
[02:49.30] 承襲 古典小説裏 優雅的情感
[02:53.87] 誰狂熱 會自焚
[02:57.78] 誰又要火速 私訂終身 (與你有種牽引)
[03:02.51] 甜蜜每日一小片比較動人 (勝過世間一見就吻)
[03:07.27] 情是 今晚淺酌過 一世都微醺
[03:11.70] 重演 父母初相識 的氣氛
[03:19.35] 我倆這天初約
[03:23.64] 逛遍市區所有路燈
[03:28.62]
[03:32.45] 與你有種戀愛預感
[03:35.57]`;

/* ===== audio sources (same folder as this page) ===== */
const SRC = [
  encodeURI("MC 張天賦 - 老派約會之必要 ｜ 歌詞版 [f5UhWQpmCQs].mp3"),
  encodeURI("MC 張天賦 - 老派約會之必要 ｜ 伴奏 ｜ KTV [KMFYbSEvbDg].mp3")
];

/* ===== parse LRC ===== */
const lines = LRC.trim().split("\n").map(l => {
  const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
  if (!m) return null;
  return { t: +m[1] * 60 + +m[2], text: m[3].trim() };
}).filter(Boolean);

const wrap = document.getElementById("lyricsWrap");
const box  = document.getElementById("lyrics");
box.innerHTML = lines.map((l, i) =>
  `<div class="line${l.text ? "" : " gap"}" data-i="${i}">${l.text || "♪ ♪ ♪"}</div>`
).join("");

/* ===== elements ===== */
const audio   = new Audio();
audio.preload = "auto";
audio.src     = SRC[0];
const playBtn = document.getElementById("play");
const bar     = document.getElementById("bar");
const timeEl  = document.getElementById("time");
const errEl   = document.getElementById("err");
let cur = 0, seeking = false;

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

/* ===== sync ===== */
function render() {
  const t = audio.currentTime + 0.15;               // slight lead feels natural
  let i = 0;
  while (i + 1 < lines.length && lines[i + 1].t <= t) i++;
  if (i !== cur) {
    cur = i;
    [...box.children].forEach((el, k) => el.classList.toggle("active", k === i));
    const el = box.children[i];
    wrap.scrollTo({ top: el.offsetTop - wrap.clientHeight/2 + el.clientHeight/2,
                    behavior: "smooth" });
  }
  if (!seeking) bar.value = audio.duration ? (audio.currentTime/audio.duration)*1000 : 0;
  timeEl.textContent = `${fmt(audio.currentTime||0)} / ${fmt(audio.duration||223)}`;
  if (!audio.paused) requestAnimationFrame(render);
}

/* ===== controls ===== */
playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay  = () => { playBtn.textContent = "❚❚"; requestAnimationFrame(render); };
audio.onpause = () => { playBtn.textContent = "▶"; render(); };
audio.onerror = () => errEl.style.display = "block";

bar.oninput  = () => { seeking = true; };
bar.onchange = () => { audio.currentTime = (bar.value/1000)*(audio.duration||223); seeking = false; };

document.querySelectorAll(".mode").forEach(btn => {
  btn.onclick = () => {
    const t = audio.currentTime, wasPlaying = !audio.paused;
    document.querySelectorAll(".mode").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    audio.src = SRC[+btn.dataset.src];
    audio.currentTime = t;
    if (wasPlaying) audio.play();
  };
});

/* tap a line to jump there */
box.onclick = e => {
  const el = e.target.closest(".line");
  if (el) { audio.currentTime = lines[+el.dataset.i].t; audio.play(); }
};

render();
</script>
</body>
</html>
